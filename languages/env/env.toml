[meta]
name = "env"
extensions = ["env"]

[states.root]
rules = [
    # Comments
    { match = '^[#;].*', token = "comment" },
    # Export prefix
    { match = '^\s*export\b', token = "keyword.declaration" },
    # Variable keys before '='
    { match = '[a-zA-Z0-9_\-]+', lookahead = '\s*=', token = "keyword" },
    # Assignment
    { match = '=', token = "operator" },
    # Quoted strings
    { match = '"(?:[^"\\]|\\.)*"', token = "string" },
    { match = "'[^']*'", token = "string" },
    # Variable expansions
    { match = '\$\{[^}]+\}|\$[a-zA-Z_]\w*', token = "variable" },
    # Booleans
    { match = '\b(?:true|false|yes|no|on|off)\b', token = "boolean" },
    # Numbers
    { match = '\b\d+(?:\.\d+)?\b', token = "number" },
    # Unquoted values / paths
    { match = '[a-zA-Z0-9_\-\./~@:+]+', token = "type" },
]
