[meta]
name = "python"
extensions = ["py", "pyw", "pyi"]

[states.root]
rules = [
    # Shebang
    { match = '^#!.*', token = "keyword.directive", first_line = true },
    # Comments
    { match = '#.*', token = "comment" },
    # Triple-quoted strings
    { match = '[rRfFbBuU]*"""', token = "string", push = "triple_double_string" },
    { match = "[rRfFbBuU]*'''", token = "string", push = "triple_single_string" },
    # Single-quoted strings
    { match = '[rRfFbBuU]*"', token = "string", push = "double_string" },
    { match = "[rRfFbBuU]*'", token = "string", push = "single_string" },
    # Decorators
    { match = '@[a-zA-Z_]\w*(?:\.[a-zA-Z_]\w*)*', token = "attribute" },
    # Keywords
    { match = '\b(?:def|lambda)\b', token = "keyword.function" },
    { match = '\bclass\b', token = "keyword.declaration" },
    { match = '\b(?:if|elif|else|match|case)\b', token = "keyword.conditional" },
    { match = '\b(?:for|while)\b', token = "keyword.repeat" },
    { match = '\b(?:return|yield)\b', token = "keyword.return" },
    { match = '\b(?:try|except|finally|raise)\b', token = "keyword.exception" },
    { match = '\b(?:async|await)\b', token = "keyword.coroutine" },
    { match = '\b(?:import|from|as)\b', token = "keyword.import" },
    { match = '\b(?:and|or|not|is|in)\b', token = "keyword.operator" },
    { match = '\b(?:with|pass|break|continue|global|nonlocal|assert|del)\b', token = "keyword" },
    { match = '\b(?:self|cls)\b', token = "variable.builtin" },
    # Constants
    { match = '\b(?:True|False)\b', token = "boolean" },
    { match = '\b(?:None|Ellipsis|NotImplemented)\b', token = "constant.builtin" },
    # Built-in functions
    { match = '\b(?:print|len|enumerate|zip|map|filter|sum|min|max|abs|all|any|bin|hex|oct|chr|ord|dir|id|isinstance|issubclass|iter|next|open|repr|round|sorted|super|vars)\b', token = "function.builtin" },
    # Built-in Types
    { match = '\b(?:int|float|str|bool|list|dict|set|tuple|object|Exception|bytes|bytearray|type|complex|frozenset|range|slice|memoryview)\b', token = "type.builtin" },
    # Numbers
    { match = '\b0[xX][0-9a-fA-F_]+\b', token = "number" },
    { match = '\b0[oO][0-7_]+\b', token = "number" },
    { match = '\b0[bB][01_]+\b', token = "number" },
    { match = '\b\d[\d_]*\.\d[\d_]*(?:[eE][+-]?\d+)?[jJ]?\b', token = "number.float" },
    { match = '\b\d[\d_]*(?:[eE][+-]?\d+)[jJ]?\b', token = "number.float" },
    { match = '\b\d[\d_]*[jJ]?\b', token = "number" },
    # Function calls
    { match = '[a-zA-Z_]\w*', lookahead = '\s*\(', token = "function.call" },
    # Constants and Types
    { match = '\b[A-Z][A-Z0-9_]+\b', token = "constant" },
    { match = '\b[A-Z]\w*\b', token = "type" },
    # Variables
    { match = '[a-zA-Z_]\w*', token = "variable" },
    # Multi-character operators
    { match = '==|!=|<=|>=|//|\*\*|->|:=|<<|>>|\+=|-=|\*=|/=|//=|%=|\*\*=|&=|\|=|\^=|<<=|>>=', token = "operator" },
    # Single-character operators
    { match = '[-+*/%&|^~=<>!:]', token = "operator" },
    # Brackets
    { match = '[(){}\[\]]', token = "punctuation.bracket" },
    # Delimiters
    { match = '[,;.]', token = "punctuation.delimiter" },
]

[states.double_string]
pop_on_newline = true
default_token = "string"
rules = [
    { match = '\\(?:[nrt0\\"\x27]|x[0-9a-fA-F]{2}|u[0-9a-fA-F]{4}|U[0-9a-fA-F]{8})', token = "string.escape" },
    { match = '\\.', token = "string.escape" },
    { match = '\{[^}]*\}', token = "punctuation.special" },
    { match = '"', token = "string", pop = true },
]

[states.single_string]
pop_on_newline = true
default_token = "string"
rules = [
    { match = '\\(?:[nrt0\\"\x27]|x[0-9a-fA-F]{2}|u[0-9a-fA-F]{4}|U[0-9a-fA-F]{8})', token = "string.escape" },
    { match = '\\.', token = "string.escape" },
    { match = '\{[^}]*\}', token = "punctuation.special" },
    { match = "'", token = "string", pop = true },
]

[states.triple_double_string]
default_token = "string"
rules = [
    { match = '\\.', token = "string.escape" },
    { match = '\{[^}]*\}', token = "punctuation.special" },
    { match = '"""', token = "string", pop = true },
]

[states.triple_single_string]
default_token = "string"
rules = [
    { match = '\\.', token = "string.escape" },
    { match = '\{[^}]*\}', token = "punctuation.special" },
    { match = "'''", token = "string", pop = true },
]
