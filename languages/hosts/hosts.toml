[meta]
name = "hosts"
extensions = ["hosts"]

[states.root]
rules = [
    # Comments
    { match = '^[#;].*', token = "comment" },
    # Resolv.conf directives
    { match = '^\b(?:nameserver|search|domain|options|sortlist)\b', token = "keyword" },
    # Options key-value in resolv.conf (e.g. timeout:2, attempts:3, rotate)
    { match = '[a-zA-Z_\-]+:[0-9]+', token = "number" },
    # Port for IP addresses in resolv.conf/hosts (e.g. :53 or #53) -> Cyan
    { match = ':[0-9]+|#[0-9]+', token = "operator" },
    # IPv4 addresses
    { match = '\b(?:\d{1,3}\.){3}\d{1,3}\b', token = "type" },
    # IPv6 addresses (full, compressed, localhost, link-local)
    { match = '::1\b|\b[0-9a-fA-F]{1,4}(?::[0-9a-fA-F]{1,4}){1,7}\b|\b[0-9a-fA-F:]+::[0-9a-fA-F:]*\b', token = "type" },
    # Brackets around IPv6 addresses e.g. [::1]:53
    { match = '[\[\]]', token = "punctuation.bracket" },
    # Hostnames and domain names
    { match = '\blocalhost\b|[a-zA-Z0-9_\-]+(?:\.[a-zA-Z0-9_\-]+)+|[a-zA-Z0-9_\-]+', token = "variable" },
]
