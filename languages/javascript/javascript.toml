[meta]
name = "javascript"
extensions = ["js", "mjs", "cjs", "jsx"]

[states.root]
include = ["comments", "expressions"]

[states.expressions]
rules = [
    # Strings
    { match = '"', token = "string", push = "double_string" },
    { match = "'", token = "string", push = "single_string" },
    { match = '`', token = "string", push = "template_string" },
    # Keywords
    { match = '\bfunction\b', token = "keyword.function" },
    { match = '\b(?:const|let|var|class)\b', token = "keyword.declaration" },
    { match = '\b(?:if|else|switch|case|default)\b', token = "keyword.conditional" },
    { match = '\b(?:for|while|do)\b', token = "keyword.repeat" },
    { match = '\b(?:return|yield)\b', token = "keyword.return" },
    { match = '\b(?:try|catch|finally|throw)\b', token = "keyword.exception" },
    { match = '\b(?:async|await)\b', token = "keyword.coroutine" },
    { match = '\b(?:import|export|from|as)\b', token = "keyword.import" },
    { match = '\b(?:typeof|instanceof|in|of|delete|void|new)\b', token = "keyword.operator" },
    { match = '\b(?:static|get|set)\b', token = "keyword.modifier" },
    { match = '\b(?:break|continue|debugger|extends|with)\b', token = "keyword" },
    { match = '\b(?:this|super|arguments)\b', token = "variable.builtin" },
    # Constants
    { match = '\b(?:true|false)\b', token = "boolean" },
    { match = '\b(?:null|undefined|NaN|Infinity)\b', token = "constant.builtin" },
    # Built-in Types
    { match = '\b(?:Object|Array|String|Number|Boolean|Symbol|Function|Promise|Map|Set|WeakMap|WeakSet|Date|RegExp|Error|Math|JSON|console|window|document|globalThis|BigInt)\b', token = "type.builtin" },
    # Numbers
    { match = '\b0[xX][0-9a-fA-F_]+n?\b', token = "number" },
    { match = '\b0[bB][01_]+n?\b', token = "number" },
    { match = '\b0[oO][0-7_]+n?\b', token = "number" },
    { match = '\b\d[\d_]*\.\d[\d_]*(?:[eE][+-]?\d+)?\b', token = "number.float" },
    { match = '\b\d[\d_]*(?:[eE][+-]?\d+)\b', token = "number.float" },
    { match = '\b\d[\d_]*n?\b', token = "number" },
    # Function calls
    { match = '[a-zA-Z_$][\w$]*', lookahead = '\s*\(', token = "function.call" },
    # Constants and Types
    { match = '\b[A-Z][A-Z0-9_$]+\b', token = "constant" },
    { match = '\b[A-Z][\w$]*\b', token = "type" },
    # Variables
    { match = '[a-zA-Z_$][\w$]*', token = "variable" },
    # Multi-character operators
    { match = '===|!==|<=|>=|=>|\+\+|--|&&|\|\||\?\?|\?\.|<<=|>>>=|>>=|<<|>>>|>>|\+=|-=|\*=|/=|%=|&=|\|=|\^=|\*\*=', token = "operator" },
    # Single-character operators
    { match = '[-+*/%&|^~=<>!?:]', token = "operator" },
    # Brackets
    { match = '[(){}\[\]]', token = "punctuation.bracket" },
    # Delimiters
    { match = '[,;.]', token = "punctuation.delimiter" },
]

[states.double_string]
pop_on_newline = true
default_token = "string"
rules = [
    { match = '\\(?:[nrt0\\"\x27]|x[0-9a-fA-F]{2}|u[0-9a-fA-F]{4}|u\{[0-9a-fA-F]+\})', token = "string.escape" },
    { match = '\\.', token = "string.escape" },
    { match = '"', token = "string", pop = true },
]

[states.single_string]
pop_on_newline = true
default_token = "string"
rules = [
    { match = '\\(?:[nrt0\\"\x27]|x[0-9a-fA-F]{2}|u[0-9a-fA-F]{4}|u\{[0-9a-fA-F]+\})', token = "string.escape" },
    { match = '\\.', token = "string.escape" },
    { match = "'", token = "string", pop = true },
]

[states.template_string]
default_token = "string"
rules = [
    { match = '\\.', token = "string.escape" },
    { match = '\$\{', token = "punctuation.special", push = "template_expr" },
    { match = '`', token = "string", pop = true },
]

[states.template_expr]
include = ["comments", "expressions"]
rules = [
    { match = '\}', token = "punctuation.special", pop = true },
]

[states.comments]
rules = [
    { match = '//.*', token = "comment" },
    { match = '/\*', token = "comment", push = "block_comment" },
]

[states.block_comment]
default_token = "comment"
rules = [
    { match = '/\*', token = "comment", push = "block_comment" },
    { match = '\*/', token = "comment", pop = true },
]
