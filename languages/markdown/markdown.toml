[meta]
name = "markdown"
extensions = ["md", "markdown"]

[states.root]
rules = [
    # Headings
    { match = '^#{1,6}\s+.*', token = "markup.heading" },
    # Code fence with language injection
    { match = '^```\s*([a-zA-Z0-9_-]+)', token = "punctuation.delimiter", embed = "$1", embed_end = '^```\s*$' },
    { match = '^~~~\s*([a-zA-Z0-9_-]+)', token = "punctuation.delimiter", embed = "$1", embed_end = '^~~~\s*$' },
    # Code fence without language
    { match = '^```\s*$', token = "punctuation.delimiter", embed = "", embed_end = '^```\s*$' },
    { match = '^~~~\s*$', token = "punctuation.delimiter", embed = "", embed_end = '^~~~\s*$' },
    # Blockquotes
    { match = '^>\s+.*', token = "comment" },
    # Horizontal rules
    { match = '^(?:---|\*\*\*|___)\s*$', token = "punctuation.delimiter" },
    # List bullets and numbering
    { match = '^\s*(?:[-*+]|\d+\.)\s+', token = "punctuation.special" },
    # Inline code
    { match = '`[^`\n]+`', token = "markup.raw" },
    # Bold text
    { match = '\*\*[^*\n]+\*\*|__[^_\n]+__', token = "markup.bold" },
    # Italic text
    { match = '\*[^*\n]+\*|_[^_\n]+_', token = "markup.italic" },
    # Links
    { match = '\[[^\]\n]+\]', token = "string" },
    { match = '\([^)\n]+\)', token = "markup.raw" },
]
