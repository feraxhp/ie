[meta]
name = "go"
extensions = ["go"]

[states.root]
include = ["comments"]
rules = [
    # Strings
    { match = '"', token = "string", push = "string" },
    { match = '`', token = "string", push = "raw_string" },
    # Runes
    { match = '\x27(?:\\(?:[nrt0\\"\x27]|x[0-9a-fA-F]{2}|u[0-9a-fA-F]{4}|U[0-9a-fA-F]{8})|[^\x27\\\n])\x27', token = "character" },
    # Keywords
    { match = '\bfunc\b', token = "keyword.function" },
    { match = '\b(?:package|import)\b', token = "keyword.import" },
    { match = '\b(?:var|const|type)\b', token = "keyword.declaration" },
    { match = '\b(?:if|else|switch|case|default|select)\b', token = "keyword.conditional" },
    { match = '\b(?:for|range)\b', token = "keyword.repeat" },
    { match = '\b(?:return|fallthrough|break|continue|goto)\b', token = "keyword.return" },
    { match = '\b(?:go|defer)\b', token = "keyword.coroutine" },
    { match = '\b(?:struct|interface|map|chan)\b', token = "keyword" },
    # Constants
    { match = '\b(?:true|false)\b', token = "boolean" },
    { match = '\b(?:nil|iota)\b', token = "constant.builtin" },
    # Built-in functions
    { match = '\b(?:append|cap|close|complex|copy|delete|imag|len|make|new|panic|print|println|real|recover)\b', token = "function.builtin" },
    # Types
    { match = '\b(?:int|int8|int16|int32|int64|uint|uint8|uint16|uint32|uint64|uintptr|float32|float64|complex64|complex128|string|bool|byte|rune|error|any)\b', token = "type.builtin" },
    # Numbers
    { match = '\b0[xX][0-9a-fA-F_]+\b', token = "number" },
    { match = '\b0[bB][01_]+\b', token = "number" },
    { match = '\b0[oO]?[0-7_]+\b', token = "number" },
    { match = '\b\d[\d_]*\.\d[\d_]*(?:[eE][+-]?\d+)?(?:i)?\b', token = "number.float" },
    { match = '\b\d[\d_]*(?:[eE][+-]?\d+)(?:i)?\b', token = "number.float" },
    { match = '\b\d[\d_]*i?\b', token = "number" },
    # Function calls
    { match = '[a-zA-Z_]\w*', lookahead = '\s*\(', token = "function.call" },
    # Constants and Types
    { match = '\b[A-Z][A-Z0-9_]+\b', token = "constant" },
    { match = '\b[A-Z]\w*\b', token = "type" },
    # Variables
    { match = '[a-zA-Z_]\w*', token = "variable" },
    # Multi-character operators
    { match = ':=|<-|\+\+|--|<=|>=|==|!=|&&|\|\||<<=|>>=|<<|>>|&\^=|&\^|\+=|-=|\*=|/=|%=|&=|\|=|\^=', token = "operator" },
    # Single-character operators
    { match = '[-+*/%&|^~=<>!?:]', token = "operator" },
    # Brackets
    { match = '[(){}\[\]]', token = "punctuation.bracket" },
    # Delimiters
    { match = '[,;.]', token = "punctuation.delimiter" },
]

[states.string]
pop_on_newline = true
default_token = "string"
rules = [
    { match = '\\(?:[nrt0\\"\x27]|x[0-9a-fA-F]{2}|u[0-9a-fA-F]{4}|U[0-9a-fA-F]{8})', token = "string.escape" },
    { match = '\\.', token = "string.escape" },
    { match = '"', token = "string", pop = true },
]

[states.raw_string]
default_token = "string"
rules = [
    { match = '`', token = "string", pop = true },
]

[states.comments]
rules = [
    { match = '//.*', token = "comment" },
    { match = '/\*', token = "comment", push = "block_comment" },
]

[states.block_comment]
default_token = "comment"
rules = [
    { match = '/\*', token = "comment", push = "block_comment" },
    { match = '\*/', token = "comment", pop = true },
]
