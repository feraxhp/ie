[package]
name = "ie"
version = "0.3.0"
edition = "2024"
license = "MIT"
authors = ["feraxhp <feraxhp+gh@gmail.com>"]
description = "A inline editor TUI to fast edit a file"
homepage = "https://github.com/feraxhp/ie"


[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["cargo"] }
clap_complete = { version = "4.6.3" }
crossterm = "0.29.0"
git2 = "0.21.0"
ratatui = "0.30.0"
ratatui-code-editor = "0.0.6"

[[bin]]
name = "ie"
path = "src/main.rs"

[package.metadata.generate-rpm]
name = "ie"
url="https://github.com/feraxhp/ie"
assets = [
    { source = "target/release/ie", dest = "/usr/bin/ie", mode = "755" },
]

[package.metadata.deb]
name = "ie"
depends="$auto"
assets = [
    ["target/release/ie", "usr/bin/", "755"],
]
