[meta]
name = "c_sharp"
extensions = ["cs"]

[states.root]
include = ["comments"]
rules = [
    # Preprocessor directives
    { match = '^#\s*\w+.*', token = "keyword.directive" },
    # Verbatim strings
    { match = '@"', token = "string", push = "verbatim_string" },
    # Interpolated strings
    { match = '\$@?"', token = "string", push = "interpolated_string" },
    # Normal string
    { match = '"', token = "string", push = "string" },
    # Character literals
    { match = '\x27(?:\\(?:[nrt0\\"\x27]|x[0-9a-fA-F]{2}|u[0-9a-fA-F]{4})|[^\x27\\\n])\x27', token = "character" },
    # Keywords
    { match = '\b(?:if|else|switch|case|default)\b', token = "keyword.conditional" },
    { match = '\b(?:for|foreach|while|do)\b', token = "keyword.repeat" },
    { match = '\b(?:return|yield|break|continue|goto)\b', token = "keyword.return" },
    { match = '\b(?:try|catch|finally|throw)\b', token = "keyword.exception" },
    { match = '\b(?:async|await)\b', token = "keyword.coroutine" },
    { match = '\b(?:class|struct|interface|enum|record|delegate|namespace|using)\b', token = "keyword.declaration" },
    { match = '\b(?:public|private|protected|internal|static|readonly|volatile|virtual|override|abstract|sealed|partial|extern|unsafe|new)\b', token = "keyword.modifier" },
    { match = '\b(?:is|as|sizeof|typeof|nameof|checked|unchecked|stackalloc|with|in|out|ref)\b', token = "keyword.operator" },
    { match = '\b(?:this|base|value)\b', token = "variable.builtin" },
    # Constants
    { match = '\b(?:true|false|null)\b', token = "constant.builtin" },
    # Types
    { match = '\b(?:bool|byte|char|decimal|double|float|int|long|object|sbyte|short|string|uint|ulong|ushort|void|var|dynamic)\b', token = "type.builtin" },
    { match = '\b(?:String|Int32|Int64|Boolean|Task|List|Dictionary|Action|Func|Object|Exception|Nullable|Span|ReadOnlySpan|Memory)\b', token = "type" },
    # Numbers
    { match = '\b0[xX][0-9a-fA-F_]+[uUlL]*\b', token = "number" },
    { match = '\b0[bB][01_]+[uUlL]*\b', token = "number" },
    { match = '\b\d[\d_]*\.\d[\d_]*(?:[eE][+-]?\d+)?[fFdDmMuUlL]*\b', token = "number.float" },
    { match = '\b\d[\d_]*(?:[eE][+-]?\d+)[fFdDmMuUlL]*\b', token = "number.float" },
    { match = '\b\d[\d_]*[fFdDmMuUlL]*\b', token = "number" },
    # Function calls
    { match = '[a-zA-Z_]\w*', lookahead = '\s*\(', token = "function.call" },
    # Constants and Types
    { match = '\b[A-Z][A-Z0-9_]+\b', token = "constant" },
    { match = '\b[A-Z]\w*\b', token = "type" },
    # Variables
    { match = '[a-zA-Z_]\w*', token = "variable" },
    # Multi-character operators
    { match = '=>|::|\?\?|\?\.|<=|>=|==|!=|&&|\|\||\+\+|--|\+=|-=|\*=|/=|%=|&=|\|=|\^=', token = "operator" },
    # Single-character operators
    { match = '[-+*/%&|^~=<>!?:]', token = "operator" },
    # Brackets
    { match = '[(){}\[\]]', token = "punctuation.bracket" },
    # Delimiters
    { match = '[,;.]', token = "punctuation.delimiter" },
]

[states.string]
pop_on_newline = true
default_token = "string"
rules = [
    { match = '\\(?:[nrt0\\"\x27]|x[0-9a-fA-F]{2}|u[0-9a-fA-F]{4})', token = "string.escape" },
    { match = '\\.', token = "string.escape" },
    { match = '"', token = "string", pop = true },
]

[states.verbatim_string]
default_token = "string"
rules = [
    { match = '""', token = "string.escape" },
    { match = '"', token = "string", pop = true },
]

[states.interpolated_string]
pop_on_newline = true
default_token = "string"
rules = [
    { match = '\\.', token = "string.escape" },
    { match = '\{', token = "punctuation.special", push = "interpolation" },
    { match = '"', token = "string", pop = true },
]

[states.interpolation]
rules = [
    { match = '\}', token = "punctuation.special", pop = true },
    { match = '"', token = "string", push = "string" },
    { match = '[a-zA-Z_]\w*', token = "variable" },
    { match = '[,;.:]', token = "punctuation.delimiter" },
    { match = '[-+*/%=<>!&|^~?]', token = "operator" },
]

[states.comments]
rules = [
    { match = '//.*', token = "comment" },
    { match = '/\*', token = "comment", push = "block_comment" },
]

[states.block_comment]
default_token = "comment"
rules = [
    { match = '/\*', token = "comment", push = "block_comment" },
    { match = '\*/', token = "comment", pop = true },
]
