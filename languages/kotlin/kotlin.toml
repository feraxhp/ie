[meta]
name = "kotlin"
extensions = ["kt", "kts"]

[states.root]
include = ["comments", "expressions"]

[states.expressions]
rules = [
    # Multi-line strings
    { match = '"""', token = "string", push = "raw_string" },
    # Normal strings
    { match = '"', token = "string", push = "string" },
    # Characters
    { match = '\x27(?:\\(?:[nrt0\\"\x27]|u[0-9a-fA-F]{4})|[^\x27\\\n])\x27', token = "character" },
    # Annotations
    { match = '@[a-zA-Z_]\w*', token = "attribute" },
    # Keywords
    { match = '\bfun\b', token = "keyword.function" },
    { match = '\b(?:val|var)\b', token = "keyword.declaration" },
    { match = '\b(?:class|interface|object|enum|annotation|typealias)\b', token = "keyword.declaration" },
    { match = '\b(?:data|sealed|abstract|open|override|private|protected|public|internal|final|inline|infix|operator|tailrec|external|const|lateinit|vararg)\b', token = "keyword.modifier" },
    { match = '\b(?:if|else|when)\b', token = "keyword.conditional" },
    { match = '\b(?:for|while|do)\b', token = "keyword.repeat" },
    { match = '\b(?:return|break|continue)\b', token = "keyword.return" },
    { match = '\b(?:try|catch|finally|throw)\b', token = "keyword.exception" },
    { match = '\b(?:suspend|yield)\b', token = "keyword.coroutine" },
    { match = '\b(?:package|import)\b', token = "keyword.import" },
    { match = '\b(?:is|as|in)\b', token = "keyword.operator" },
    { match = '\b(?:this|super|it)\b', token = "variable.builtin" },
    # Constants
    { match = '\b(?:true|false)\b', token = "boolean" },
    { match = '\bnull\b', token = "constant.builtin" },
    # Built-in functions
    { match = '\b(?:println|print|arrayOf|listOf|mapOf|setOf)\b', token = "function.builtin" },
    # Built-in Types
    { match = '\b(?:Boolean|Byte|Short|Int|Long|Float|Double|Char|String|Array|List|Map|Set|Any|Unit|Nothing)\b', token = "type.builtin" },
    # Numbers
    { match = '\b0[xX][0-9a-fA-F_]+[uUL]*\b', token = "number" },
    { match = '\b0[bB][01_]+[uUL]*\b', token = "number" },
    { match = '\b\d[\d_]*\.\d[\d_]*(?:[eE][+-]?\d+)?[fFL]?\b', token = "number.float" },
    { match = '\b\d[\d_]*(?:[eE][+-]?\d+)[fFL]?\b', token = "number.float" },
    { match = '\b\d[\d_]*[uULfF]?\b', token = "number" },
    # Function calls
    { match = '[a-zA-Z_]\w*', lookahead = '\s*\(', token = "function.call" },
    # Constants and Types
    { match = '\b[A-Z][A-Z0-9_]+\b', token = "constant" },
    { match = '\b[A-Z]\w*\b', token = "type" },
    # Variables
    { match = '[a-zA-Z_]\w*', token = "variable" },
    # Multi-character operators
    { match = '===|!==|==|!=|<=|>=|->|\+\+|--|\?\:|\?\.|!!|\+=|-=|\*=|/=|%=', token = "operator" },
    # Single-character operators
    { match = '[-+*/%=<>!&|^~?]', token = "operator" },
    # Brackets
    { match = '[(){}\[\]]', token = "punctuation.bracket" },
    # Delimiters
    { match = '::|[.,;:]', token = "punctuation.delimiter" },
]

[states.string]
pop_on_newline = true
default_token = "string"
rules = [
    { match = '\\(?:[nrt0\\"\x27]|u[0-9a-fA-F]{4})', token = "string.escape" },
    { match = '\\.', token = "string.escape" },
    { match = '\$\{[^}]+\}|\$[a-zA-Z_]\w*', token = "punctuation.special" },
    { match = '"', token = "string", pop = true },
]

[states.raw_string]
default_token = "string"
rules = [
    { match = '\$\{[^}]+\}|\$[a-zA-Z_]\w*', token = "punctuation.special" },
    { match = '"""', token = "string", pop = true },
]

[states.comments]
rules = [
    { match = '//.*', token = "comment" },
    { match = '/\*', token = "comment", push = "block_comment" },
]

[states.block_comment]
default_token = "comment"
rules = [
    { match = '/\*', token = "comment", push = "block_comment" },
    { match = '\*/', token = "comment", pop = true },
]
