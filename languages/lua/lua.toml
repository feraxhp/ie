[meta]
name = "lua"
extensions = ["lua"]

[states.root]
include = ["comments"]
rules = [
    # Multi-line strings [[ ... ]]
    { match = '\[\[', token = "string", push = "multiline_string" },
    # Double-quoted strings
    { match = '"', token = "string", push = "double_string" },
    # Single-quoted strings
    { match = "'", token = "string", push = "single_string" },
    # Keywords
    { match = '\bfunction\b', token = "keyword.function" },
    { match = '\blocal\b', token = "keyword.declaration" },
    { match = '\b(?:if|then|else|elseif)\b', token = "keyword.conditional" },
    { match = '\b(?:for|while|do|repeat|until)\b', token = "keyword.repeat" },
    { match = '\b(?:return|break)\b', token = "keyword.return" },
    { match = '\b(?:and|or|not)\b', token = "keyword.operator" },
    { match = '\b(?:end|in|goto)\b', token = "keyword" },
    # Constants
    { match = '\b(?:true|false)\b', token = "boolean" },
    { match = '\bnil\b', token = "constant.builtin" },
    # Built-in functions
    { match = '\b(?:print|pairs|ipairs|type|tostring|tonumber|require|assert|error|pcall|xpcall|setmetatable|getmetatable|rawget|rawset|select|next|collectgarbage)\b', token = "function.builtin" },
    # Standard modules
    { match = '\b(?:string|table|math|io|os|debug|package|coroutine|utf8)\b', token = "type" },
    # Numbers: hex and float and decimal
    { match = '\b0[xX][0-9a-fA-F_]+(?:\.[0-9a-fA-F_]+)?(?:[pP][+-]?\d+)?\b', token = "number" },
    { match = '\b\d[\d_]*\.\d[\d_]*(?:[eE][+-]?\d+)?\b', token = "number.float" },
    { match = '\b\d[\d_]*(?:[eE][+-]?\d+)\b', token = "number.float" },
    { match = '\b\d[\d_]*\b', token = "number" },
    # Function calls
    { match = '[a-zA-Z_]\w*', lookahead = '\s*\(', token = "function.call" },
    # Types (capitalized identifier)
    { match = '\b[A-Z]\w*\b', token = "type" },
    # Variables
    { match = '[a-zA-Z_]\w*', token = "variable" },
    # Multi-character operators
    { match = '\.\.\.|==|~=|<=|>=|//|\.\.', token = "operator" },
    # Single-character operators
    { match = '[-+*/%^#=<>:]', token = "operator" },
    # Brackets
    { match = '[(){}\[\]]', token = "punctuation.bracket" },
    # Delimiters
    { match = '[,;.]', token = "punctuation.delimiter" },
]

[states.double_string]
pop_on_newline = true
default_token = "string"
rules = [
    { match = '\\(?:[nrt0\\"\x27]|x[0-9a-fA-F]{2}|u\{[0-9a-fA-F]+\}|\d{1,3})', token = "string.escape" },
    { match = '\\.', token = "string.escape" },
    { match = '"', token = "string", pop = true },
]

[states.single_string]
pop_on_newline = true
default_token = "string"
rules = [
    { match = '\\(?:[nrt0\\"\x27]|x[0-9a-fA-F]{2}|u\{[0-9a-fA-F]+\}|\d{1,3})', token = "string.escape" },
    { match = '\\.', token = "string.escape" },
    { match = "'", token = "string", pop = true },
]

[states.multiline_string]
default_token = "string"
rules = [
    { match = '\]\]', token = "string", pop = true },
]

[states.comments]
rules = [
    { match = '--\[\[', token = "comment", push = "block_comment" },
    { match = '--.*', token = "comment" },
]

[states.block_comment]
default_token = "comment"
rules = [
    { match = '\]\]', token = "comment", pop = true },
]
